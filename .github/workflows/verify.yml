name: Grounding and privacy verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.21.4
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm run verify
      - run: npm run verify:submission
      - run: npm run verify:baseline
